name: Build Android debug APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the Android SDK; use it directly.
      - name: Install Android platform 35
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NafahatKey-debug-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish APK to the apk-builds branch
        run: |
          mkdir /tmp/pub && cp app/build/outputs/apk/debug/app-debug.apk /tmp/pub/NafahatKey.apk
          cd /tmp/pub
          git init -q -b apk-builds
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add NafahatKey.apk
          git commit -qm "APK from ${GITHUB_SHA}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" apk-builds
