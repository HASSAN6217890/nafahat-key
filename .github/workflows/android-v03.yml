name: NafahatKey v0.3 Native Android
on:
  push:
    branches: [chatgpt-v0.3]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate offline Arabic/English lexicons
        run: |
          python3 -m pip install --user 'wordfreq==3.1.1'
          python3 tools/generate_lexicon_v03.py
      - name: Verify safeguards
        run: python3 tools/verify_keyboard_v03.py
      - name: Compile debug APK
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: NafahatKey-v0.3-debug
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Check release credentials
        id: signing
        env:
          KS: ${{ secrets.NAFAHATKEY_KEYSTORE_B64 }}
          SP: ${{ secrets.NAFAHATKEY_STORE_PASSWORD }}
          KA: ${{ secrets.NAFAHATKEY_KEY_ALIAS }}
          KP: ${{ secrets.NAFAHATKEY_KEY_PASSWORD }}
        run: |
          if [[ -n "$KS" && -n "$SP" && -n "$KA" && -n "$KP" ]]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Signed release skipped until the four NAFAHATKEY_* secrets are configured."
          fi
      - name: Extract private signing key
        if: steps.signing.outputs.ready == 'true'
        env:
          KS: ${{ secrets.NAFAHATKEY_KEYSTORE_B64 }}
        run: |
          printf '%s' "$KS" | base64 --decode > "$RUNNER_TEMP/nafahat-release.jks"
          chmod 600 "$RUNNER_TEMP/nafahat-release.jks"
      - name: Compile signed release
        if: steps.signing.outputs.ready == 'true'
        env:
          NAFAHATKEY_STORE_FILE: ${{ runner.temp }}/nafahat-release.jks
          NAFAHATKEY_STORE_PASSWORD: ${{ secrets.NAFAHATKEY_STORE_PASSWORD }}
          NAFAHATKEY_KEY_ALIAS: ${{ secrets.NAFAHATKEY_KEY_ALIAS }}
          NAFAHATKEY_KEY_PASSWORD: ${{ secrets.NAFAHATKEY_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease
      - name: Upload signed APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: NafahatKey-v0.3-signed
          path: app/build/outputs/apk/release/app-release.apk
      - name: Publish signed NafahatKey.apk
        if: steps.signing.outputs.ready == 'true' && success()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$RUNNER_TEMP/publish"
          cp app/build/outputs/apk/release/app-release.apk "$RUNNER_TEMP/publish/NafahatKey.apk"
          cd "$RUNNER_TEMP/publish"
          git init -q -b apk-builds
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add NafahatKey.apk
          git commit -qm "Signed NafahatKey release from $GITHUB_SHA"
          git push --force "https://x-access-token:$GH_TOKEN@github.com/$GITHUB_REPOSITORY.git" apk-builds
