plugins { id 'com.android.application' }
def env=System.getenv()
def ghRun=(env.GITHUB_RUN_NUMBER ?: '0').toInteger()
def releaseReady=['NAFAHATKEY_STORE_FILE','NAFAHATKEY_STORE_PASSWORD','NAFAHATKEY_KEY_ALIAS','NAFAHATKEY_KEY_PASSWORD'].every { env[it] }
android {
    namespace 'com.nafahat.key'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nafahat.key'
        minSdk 26
        targetSdk 34
        versionCode 100 + ghRun
        versionName '0.3.' + ghRun
    }
    signingConfigs {
        if(releaseReady) {
            production {
                storeFile file(env.NAFAHATKEY_STORE_FILE)
                storePassword env.NAFAHATKEY_STORE_PASSWORD
                keyAlias env.NAFAHATKEY_KEY_ALIAS
                keyPassword env.NAFAHATKEY_KEY_PASSWORD
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            if(releaseReady) signingConfig signingConfigs.production
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
gradle.taskGraph.whenReady { graph ->
    if(graph.allTasks.any {it.path==':app:assembleRelease'} && !releaseReady)
        throw new GradleException('Signed release requires the four NAFAHATKEY GitHub secrets.')
}
