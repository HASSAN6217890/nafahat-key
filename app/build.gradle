plugins {
    id 'com.android.application'
}

// Signing comes only from environment variables set by CI from GitHub Secrets.
// No keystore or password is ever stored in this repository.
def keystorePath = System.getenv('NAFAHATKEY_KEYSTORE_PATH')
def hasSigning = keystorePath != null && !keystorePath.isEmpty() && new File(keystorePath).exists()

android {
    namespace 'com.nafahat.key'
    compileSdk 35
    defaultConfig {
        applicationId 'com.nafahat.key'
        minSdk 26
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('NAFAHATKEY_VERSION_CODE') ?: '105')
        versionName System.getenv('NAFAHATKEY_VERSION_NAME') ?: '0.5.0'
    }
    signingConfigs {
        if (hasSigning) {
            release {
                storeFile file(keystorePath)
                storePassword System.getenv('NAFAHATKEY_STORE_PASSWORD')
                keyAlias System.getenv('NAFAHATKEY_KEY_ALIAS')
                // PKCS12 keystores (keytool's default) have one password for store and key.
                keyPassword System.getenv('NAFAHATKEY_STORE_PASSWORD')
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        debug {
            // A debug build is a separate app so it can never collide with the signed release.
            applicationIdSuffix '.debug'
            versionNameSuffix '-debug'
        }
        release {
            minifyEnabled false
            if (hasSigning) signingConfig signingConfigs.release
        }
    }
    lint {
        checkReleaseBuilds false
        abortOnError false
    }
}
